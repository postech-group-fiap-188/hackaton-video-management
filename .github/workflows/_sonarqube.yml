name: SonarQube Quality Gate
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true


jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: .
      - name: Debug coverage presence
        run: |
          echo "PWD=$(pwd)"
          ls -la
          ls -la coverage || true
          find . -maxdepth 6 -name "lcov.info" -print
          test -f coverage/lcov.info && echo "OK: coverage/lcov.info exists" || (echo "MISSING: coverage/lcov.info" && exit 1)

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}