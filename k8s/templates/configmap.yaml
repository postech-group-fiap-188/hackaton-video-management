apiVersion: v1
kind: ConfigMap
metadata:
  name: hackathon-video-management-config
data:
    PORT: {{ .Values.config.port | default "3000" | quote }}
    MONGO_DB_COLLECTION: {{ .Values.config.mongoDbCollection | quote }}
    S3_INPUT_BUCKET_NAME: {{ .Values.config.s3InputBucketName | quote }}
    S3_OUTPUT_BUCKET_NAME: {{ .Values.config.s3OutputBucketName | quote }}
    SNS_PROCESSING_TOPIC_ARN: {{ .Values.config.snsProcessingTopicArn | quote }}
    SQS_STATUS_QUEUE_URL: {{ .Values.config.sqsStatusQueueUrl | quote }}
    MAX_VIDEO_BYTES: {{ .Values.config.maxVideoBytes | quote }}

    NODE_ENV: {{ .Values.config.nodeEnv | default "production" | quote }}
    
    # AWS e Integrações
    AWS_REGION: {{ .Values.config.awsRegion | quote }}

    # OpenTelemetry (traces to Tempo; metrics/logs disabled)
    NODE_OPTIONS: "--require @opentelemetry/auto-instrumentations-node/register"
    OTEL_TRACES_EXPORTER: "otlp"
    OTEL_METRICS_EXPORTER: "none"
    OTEL_LOGS_EXPORTER: "none"
    OTEL_NODE_RESOURCE_DETECTORS: "env,host,os"
    OTEL_RESOURCE_ATTRIBUTES: "service.name=hackathon-video-management,service.namespace=hackathon-video-management,deployment.environment=production"
    OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | default "" }}
