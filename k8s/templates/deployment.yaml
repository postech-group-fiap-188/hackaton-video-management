apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackaton-video-management
  labels:
    app: hackaton-video-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hackaton-video-management
  template:
    metadata:
      labels:
        app: hackaton-video-management
    spec:
      containers:
        - name: api
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hackaton-video-management-config
            - secretRef:
                name: hackaton-video-management-secrets
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"